# ---------------------------------------------------
# tmuxをscreen風にする設定 (Ctrl+aをPrefixに)
# ---------------------------------------------------

# Change the prefix key to C-a
set -g prefix C-z

# Nested key table so "C-z C-a <key>" mimics screen's C-a subcommands
bind C-a switch-client -T screen-like

# Windows management
bind -T screen-like c new-window
bind -T screen-like n next-window
bind -T screen-like p previous-window
bind -T screen-like d detach

# Pain management
bind -T screen-like % split-window -h
bind -T screen-like '"' split-window -v
bind -T screen-like h select-pane -L
bind -T screen-like j select-pane -D
bind -T screen-like k select-pane -U
bind -T screen-like l select-pane -R

set-window-option -g mode-keys vi

set -g display-panes-time 1000 # ペイン番号表示時間延長
set -g display-time 1000       # ウィンドウ名表示時間延長
